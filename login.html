<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PredictiveEng | Sign In</title>
<meta name="description" content="Sign in to PredictiveEng — AI-powered predictive engineering intelligence platform."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #0e0e13;
        color: #f9f5fd;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Animated background */
    .bg-grid {
        position: fixed; inset: 0; z-index: 0;
        background-image:
            linear-gradient(rgba(172,163,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(172,163,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(60px, 60px); }
    }

    .bg-orb {
        position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; opacity: 0.4;
    }
    .orb-1 { width: 500px; height: 500px; background: #594acd; top: -150px; left: -100px; animation: wobble 12s ease-in-out infinite; }
    .orb-2 { width: 400px; height: 400px; background: #6e1048; bottom: -100px; right: -80px; animation: wobble 15s ease-in-out infinite reverse; }
    .orb-3 { width: 300px; height: 300px; background: #1c007a; top: 50%; left: 60%; animation: wobble 10s ease-in-out infinite 3s; }
    @keyframes wobble {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -20px) scale(1.05); }
        66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* Login card */
    .login-card {
        position: relative; z-index: 10;
        width: 100%; max-width: 440px;
        background: rgba(25, 25, 31, 0.85);
        backdrop-filter: blur(24px) saturate(1.5);
        border: 1px solid rgba(172,163,255,0.12);
        border-radius: 24px;
        padding: 48px 40px;
        box-shadow:
            0 0 80px rgba(89,74,205,0.08),
            0 24px 48px rgba(0,0,0,0.4);
    }

    .logo-mark {
        width: 56px; height: 56px;
        background: linear-gradient(135deg, #aca3ff 0%, #594acd 50%, #6e1048 100%);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 24px;
        box-shadow: 0 0 30px rgba(172,163,255,0.3);
        animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
        0%, 100% { box-shadow: 0 0 20px rgba(172,163,255,0.2); }
        50% { box-shadow: 0 0 40px rgba(172,163,255,0.5); }
    }

    h1 { text-align: center; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: #acaab1; margin-bottom: 36px; }

    .form-group { margin-bottom: 20px; position: relative; }
    .form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #76747b; margin-bottom: 8px; }
    .form-input {
        width: 100%; padding: 14px 16px 14px 44px;
        background: #000000; border: 1px solid rgba(72,71,77,0.4);
        border-radius: 12px; color: #f9f5fd; font-size: 14px;
        font-family: 'Inter', sans-serif;
        transition: all 0.3s ease;
        outline: none;
    }
    .form-input::placeholder { color: rgba(172,163,255,0.3); }
    .form-input:focus {
        border-color: #aca3ff;
        box-shadow: 0 0 0 3px rgba(172,163,255,0.15), 0 0 20px rgba(172,163,255,0.08);
    }
    .input-icon {
        position: absolute; left: 14px; top: 38px;
        color: #76747b; font-size: 20px;
        transition: color 0.3s;
    }
    .form-input:focus + .input-icon-placeholder { color: #aca3ff; }

    .toggle-pass {
        position: absolute; right: 14px; top: 38px;
        background: none; border: none; color: #76747b; cursor: pointer;
        transition: color 0.3s;
    }
    .toggle-pass:hover { color: #aca3ff; }

    .remember-row {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 28px; font-size: 12px;
    }
    .remember-row label { display: flex; align-items: center; gap: 8px; color: #acaab1; cursor: pointer; }
    .remember-row input[type="checkbox"] {
        width: 16px; height: 16px; accent-color: #aca3ff; border-radius: 4px; cursor: pointer;
    }
    .remember-row a { color: #aca3ff; text-decoration: none; font-weight: 600; }
    .remember-row a:hover { text-decoration: underline; }

    .btn-login {
        width: 100%; padding: 16px;
        background: linear-gradient(135deg, #aca3ff 0%, #9e93ff 50%, #594acd 100%);
        color: #000000; font-size: 15px; font-weight: 800;
        border: none; border-radius: 14px; cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase; letter-spacing: 0.05em;
        position: relative; overflow: hidden;
    }
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(172,163,255,0.35);
    }
    .btn-login:active { transform: translateY(0) scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-login .btn-shimmer {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 60%,100% { transform: translateX(100%); } }

    .divider {
        display: flex; align-items: center; gap: 16px;
        margin: 24px 0; font-size: 11px; color: #76747b; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .divider::before, .divider::after {
        content: ''; flex: 1; height: 1px; background: rgba(72,71,77,0.4);
    }

    .btn-demo {
        width: 100%; padding: 14px;
        background: transparent;
        border: 1px solid rgba(172,163,255,0.2);
        border-radius: 14px; color: #aca3ff;
        font-size: 13px; font-weight: 700; cursor: pointer;
        transition: all 0.3s ease;
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-demo:hover {
        background: rgba(172,163,255,0.06);
        border-color: rgba(172,163,255,0.4);
    }

    .error-msg {
        background: rgba(167,1,56,0.15); border: 1px solid rgba(255,110,132,0.3);
        border-radius: 10px; padding: 12px 16px;
        font-size: 12px; color: #ff6e84;
        margin-bottom: 20px; display: none;
        align-items: center; gap: 8px;
    }
    .error-msg.show { display: flex; }

    .footer-text {
        text-align: center; font-size: 11px; color: #48474d;
        margin-top: 24px;
    }
    .footer-text a { color: #76747b; text-decoration: none; }
    .footer-text a:hover { color: #aca3ff; }

    .signup-link { text-align: center; margin-top: 20px; font-size: 13px; color: #acaab1; }
    .signup-link a { color: #aca3ff; font-weight: 700; text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }

    /* Floating particles */
    .particle {
        position: fixed; border-radius: 50%; z-index: 1;
        background: rgba(172,163,255,0.15);
        animation: float linear infinite;
    }
    @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }
</style>
</head>
<body>

<!-- Background effects -->
<div class="bg-grid"></div>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<!-- Floating particles -->
<script>
(function(){
    for(let i=0;i<15;i++){
        const p=document.createElement('div');
        p.className='particle';
        const s=Math.random()*4+2;
        p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s;`;
        document.body.appendChild(p);
    }
})();
</script>

<!-- Login Card -->
<div class="login-card">
    <div class="logo-mark">
        <span class="material-symbols-outlined" style="font-size:28px;color:#fff;font-variation-settings:'FILL'1;">insights</span>
    </div>
    <h1>PredictiveEng</h1>
    <p class="subtitle">Predict failures before they happen</p>

    <div id="error-box" class="error-msg">
        <span class="material-symbols-outlined" style="font-size:18px;font-variation-settings:'FILL'1;">error</span>
        <span id="error-text">Invalid credentials.</span>
    </div>

    <form id="login-form" autocomplete="on">
        <div class="form-group">
            <label class="form-label" for="email">Email or Username</label>
            <input class="form-input" id="email" name="email" type="text" placeholder="admin@predictiveeng.ai" autofocus autocomplete="username" style="padding-left:44px"/>
            <span class="material-symbols-outlined input-icon" style="position:absolute;left:14px;top:38px;color:#76747b;">mail</span>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" id="password" name="password" type="password" placeholder="••••••••••" autocomplete="current-password" style="padding-left:44px;padding-right:44px"/>
            <span class="material-symbols-outlined input-icon" style="position:absolute;left:14px;top:38px;color:#76747b;">lock</span>
            <button type="button" class="toggle-pass" onclick="togglePassword()">
                <span id="eye-icon" class="material-symbols-outlined" style="font-size:20px;">visibility_off</span>
            </button>
        </div>

        <div class="remember-row">
            <label><input type="checkbox" id="remember" checked/> Remember me</label>
            <a href="#" onclick="alert('Please contact admin@predictiveeng.ai for support.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
            <span class="btn-shimmer"></span>
            Sign In
        </button>
    </form>

    <div class="divider">or</div>

    <button class="btn-demo" id="demo-btn" type="button">
        <span class="material-symbols-outlined" style="font-size:18px;">science</span>
        Continue as Guest (Demo)
    </button>

    <p class="signup-link">Don't have an account? <a href="#" onclick="alert('To register, contact your organization admin or email admin@predictiveeng.ai'); return false;">Sign up</a></p>

    <p class="footer-text">
        Protected by AES-256 encryption &nbsp;·&nbsp; <a href="#">Privacy</a> &nbsp;·&nbsp; <a href="#">Terms</a>
    </p>
</div>

<script>
// Demo credentials
const VALID_USERS = [
    { email: 'admin', password: 'admin' },
    { email: 'admin@predictiveeng.ai', password: 'admin123' },
    { email: 'demo', password: 'demo' },
    { email: 'judge', password: 'sunhacks2026' },
];

// Already logged in? Skip to dashboard
if (localStorage.getItem('pe_auth_token')) {
    window.location.href = '/';
}

function togglePassword() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (pw.type === 'password') {
        pw.type = 'text';
        icon.textContent = 'visibility';
    } else {
        pw.type = 'password';
        icon.textContent = 'visibility_off';
    }
}

document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const btn = document.getElementById('login-btn');

    if (!email || !password) {
        errorText.textContent = 'Please enter both email and password.';
        errorBox.classList.add('show');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="btn-shimmer"></span><span class="material-symbols-outlined" style="font-size:18px;animation:spin 1s linear infinite;">sync</span> Authenticating...';

    // Simulate auth delay for realism
    setTimeout(() => {
        const match = VALID_USERS.find(u =>
            u.email.toLowerCase() === email.toLowerCase() && u.password === password
        );

        if (match) {
            errorBox.classList.remove('show');
            localStorage.setItem('pe_auth_token', btoa(JSON.stringify({
                user: email,
                role: email.includes('admin') ? 'admin' : email === 'judge' ? 'judge' : 'viewer',
                ts: Date.now()
            })));
            localStorage.setItem('pe_user_email', email);
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;font-variation-settings:\'FILL\' 1;color:#000;">check_circle</span> Success! Redirecting...';
            btn.style.background = 'linear-gradient(135deg, #4caf50, #2e7d32)';
            btn.style.color = '#fff';
            setTimeout(() => { window.location.href = '/'; }, 800);
        } else {
            errorText.textContent = 'Invalid email or password. Try admin/admin for demo.';
            errorBox.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = '<span class="btn-shimmer"></span>Sign In';
            // Shake the card
            document.querySelector('.login-card').style.animation = 'shake 0.4s ease';
            setTimeout(() => { document.querySelector('.login-card').style.animation = ''; }, 400);
        }
    }, 1200);
});

// Guest / Demo login
document.getElementById('demo-btn').addEventListener('click', function() {
    localStorage.setItem('pe_auth_token', btoa(JSON.stringify({
        user: 'guest',
        role: 'viewer',
        ts: Date.now()
    })));
    localStorage.setItem('pe_user_email', 'guest@demo');
    window.location.href = '/';
});
</script>
<style>
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-4px); }
}
</style>
</body>
</html>
